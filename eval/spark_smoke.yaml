# A tiny, offline lm-evaluation-harness task that is meaningful on the CPU
# stub tier.
#
# Why the targets are the stub's echo: `cmd/stub-vllm` is deterministic — the
# same prompt always yields `[vllm-stub] model=<name> prompt_sha256=<crc32>`. By
# pinning that exact string as the expected answer, an exact_match of 1.0 proves
# the *whole* chain — lm-eval request encoding, the gateway/gateway path, the
# response parser and the metric — rather than a model's intelligence. Point the
# same task at a real vLLM (see `make eval` and SPARKNET_EVAL_BASE_URL) and it
# reports a genuine score instead.
task: spark_smoke
dataset_path: json
dataset_kwargs:
  data_files:
    test: eval/spark_smoke.jsonl
output_type: generate_until
test_split: test
doc_to_text: "Q: {{q}}\nA:"
doc_to_target: "{{a}}"
generation_kwargs:
  until: ["\n"]
  max_gen_toks: 32
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true

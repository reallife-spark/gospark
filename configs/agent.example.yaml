# goSpark node-agent example configuration.
#
# An agent holds no control-plane authority: it verifies the control plane's
# signed tasks, executes a closed operation whitelist, and returns an attested
# result. Start it with:
#
#   sparknet-agent -config configs/agent.example.yaml \
#     -key .state/node.key \
#     -master-pub BASE64MASTERPUB

node:
  # id/role are overwritten from the loaded key file.
  id: node-a
  role: peer
  key_file: .state/node.key
  overlay_ipv4: 10.44.0.2
  # cluster-serve is required to accept delegated compute; it is sensitive.
  capabilities:
    - telemetry
    - cluster-serve

bus:
  # Empty url => in-memory bus (single process / tests). For a real deployment
  # point at the same NATS/JetStream server as the control plane.
  url: ""
  subject_root: sparknet
  stream: SPARKNET
  # queue: leave empty so this node keeps its own durable task consumer and
  # resumes after a mesh drop. Set a shared value only for interchangeable
  # replicas of the same logical worker.
  queue: ""
  # max_deliver bounds JetStream redelivery of a failing message before it is
  # dead-lettered (default 5). Stops a poison message spinning the node.
  max_deliver: 5

transport:
  # HTTP/3 (QUIC) data plane for NVFP4 KV blocks. Use a port distinct from the
  # control plane when both run on one host.
  listen: 0.0.0.0:7444
  chunk_size: 262144
  timeout: 10s

gateway:
  listen: 127.0.0.1:8081
  upstream: http://127.0.0.1:8000
  model: Qwen/Qwen2.5-32B-Instruct

mesh:
  interface: wg0
  wg_config: /etc/wireguard/wg0.conf

router:
  edge_token_ceiling: 2048
  cluster_token_floor: 32768
  max_nodes: 4

# Compute-plane seam (optional). Point this node at a Python/CUDA worker and
# name the operations it may run; the Go plane still verifies the signed task
# and signs the result, only execution is delegated. Leave endpoint empty to
# keep the closed sandbox (arith, digest) and delegate nothing.
compute:
  endpoint: ""
  # secret: send as X-Sparknet-Auth to the worker
  secret: ""
  # operations delegated to the worker; must not shadow arith/digest
  operations: []
  timeout: 60s

# Embeddings service for the ingest driver (cmd/sparknet-ingest). Empty endpoint
# leaves ingestion at crawl-and-chunk. The reference worker serves
# /v1/embeddings and /v1/models.
embed:
  endpoint: ""
  secret: ""
  model: sparknet-embed-hash
  batch: 32
  timeout: 60s

registry:
  # Master-signed registry this node adopts at startup and verifies against its
  # pinned -master-pub. Empty => adopt from the bus, or run permissive if none.
  file: ""

log:
  level: info
  format: text

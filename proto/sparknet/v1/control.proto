// SparkNet control-plane contract (goSpark).
//
// The control plane carries *no tensor data*. It routes signed envelopes,
// node health and escalation decisions between the Go control/service plane
// and the Python/CUDA compute plane. See docs/architecture.md.
//
// These messages mirror the hand-written Go types in internal/apiv1, which are
// the ones currently compiled. Code generation (protoc + protoc-gen-go) is a
// deliberate follow-up, tracked in docs/adr/0001-go-control-plane.md.

syntax = "proto3";

package sparknet.v1;

option go_package = "github.com/reallife-spark/goSpark/internal/apiv1";

// NodeHealth is reported by every agent to the control plane. It is telemetry,
// never an authority message.
message NodeHealth {
  string node_id = 1;
  string fingerprint = 2;          // sha256 hex of the canonical node identity
  string overlay_address = 3;      // e.g. 10.100.0.7
  string wireguard_pubkey = 4;
  repeated string capabilities = 5; // capabilities currently held (granted)
  uint32 load_permille = 6;         // 0..1000, coarse load signal
  uint64 kv_cache_bytes = 7;
  bool serving = 8;                 // compute plane reachable
  int64 reported_at_unix = 9;
  GpuTelemetry gpu_telemetry = 10;  // optional; set by the sparknet-gpu sidecar
}

// GpuMetrics is one GPU's telemetry (NVML metrics, optionally a DCGM health
// verdict). Empty numeric fields are omitted, so a partial reading stays small.
message GpuMetrics {
  uint32 index = 1;
  string name = 2;
  string uuid = 3;
  uint32 temp_c = 4;
  uint64 mem_used_bytes = 5;
  uint64 mem_total_bytes = 6;
  uint32 util_pct = 7;
  uint32 mem_util_pct = 8;
  uint32 power_milliwatts = 9;
  uint32 sm_clock_mhz = 10;
  uint32 mem_clock_mhz = 11;
  string health = 12;               // DCGM verdict: Healthy | Warning | Failure | N/A
}

// GpuTelemetry is a node's GPU snapshot. `available` is false when no collector
// could read the hardware, in which case `reason` explains why and `gpus` is
// empty. It is telemetry, never an authority message.
message GpuTelemetry {
  string source = 1;                // which backend answered, e.g. "dcgm+nvml"
  bool available = 2;
  string reason = 3;
  string driver_version = 4;
  repeated GpuMetrics gpus = 5;
  int64 collected_at_unix = 6;
}

// EscalationDecision is emitted by the router. It is advisory to the caller and
// never blocks: the caller may proceed on the edge while the control plane
// schedules a DGX/cluster job out of band.
message EscalationDecision {
  enum Target {
    TARGET_UNSPECIFIED = 0;
    TARGET_EDGE = 1;                // resolve locally
    TARGET_DGX = 2;                 // single remote DGX Spark/teacher
    TARGET_CLUSTER = 3;             // fan out via a cluster job
  }
  Target target = 1;
  string reason = 2;
  uint32 estimated_prompt_tokens = 3;
  bool async_required = 4;          // always true across a WAN boundary
}

// RegisterNode is the agent -> control handshake. Each registry entry is signed
// per entry by the Master operational key; goSpark's control plane is that
// Master (it signs), and its agents consume. See contracts/identity-schema.json
// in the sparknet repo.
message RegisterNode {
  NodeHealth health = 1;
  string registry_digest = 2;       // sha256 of the adopted signed registry
}

// NodeIdentity is the projected node identity: exactly the fields the fabric
// fingerprints (contracts/identity-schema.json, `identity_fields`). The
// fingerprint is sha256 over the canonical JSON of this projection.
//
// goSpark carries the node's Ed25519 public key in wireguard_public_key_b64 —
// the slot the contract anchors identity to — so the fingerprint binds the node
// to the key results are verified against.
message NodeIdentity {
  string node_id = 1;
  string role = 2;                  // "master" | "peer"
  string wireguard_public_key_b64 = 3;
  string overlay_ipv4 = 4;
  repeated string requested_capabilities = 5;
}

// NodeAuthorization is one Master-signed registry entry, signed *per entry*
// (not as a whole document). `issued_at`/`expires_at` are ISO-8601 strings.
message NodeAuthorization {
  string fingerprint = 1;           // sha256 hex of the projected identity
  NodeIdentity identity = 2;
  repeated string capabilities = 3; // sorted; the ceiling this node may hold
  string overlay_ipv4 = 4;
  string issued_at = 5;             // ISO-8601
  string expires_at = 6;            // ISO-8601
  bool revoked = 7;                 // inside the signature: only the Master flips it
  string signature_b64 = 8;         // Master operational key over the signed envelope
}

// NodeRegistry is the set of signed node authorizations. The document itself is
// unsigned, exactly as the fabric ships manifests/node-authorizations.json.
message NodeRegistry {
  string schema_version = 1;
  string master_public_key_b64 = 2; // informational; verifiers pin the key
  string description = 3;
  repeated NodeAuthorization authorizations = 4;
}

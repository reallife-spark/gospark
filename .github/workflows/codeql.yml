# CodeQL for goSpark's Go surface, patterned on the dsx repos' `codeql-scan`
# (the fabric's references/nvidia-dsx-standard-practice.md, Step 48).
#
# No local equivalent exists for a hosted analyzer, so this is the one job that
# is genuinely GitHub-only. The local gate stays authoritative for everything it
# can check; this adds the static-analysis pass a runner can do and a driverless
# machine cannot.
name: codeql

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  # analyze() reads the workflow run it belongs to in order to classify the
  # job's outcome; without actions: read that call 403s and the step reports
  # "Resource not accessible by integration" / "configuration error" (run
  # 39063248225) even though the analysis itself succeeded.
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    # Same reason as the gate: a runner has no libdcgm/NVML headers, so the
    # extractor builds the pure-Go surface and the GPU sidecars fall back to
    # their _stub.go companions.
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Code scanning is a paid feature on private repos (GitHub Code Security);
      # without it the Analyze step fails as a "configuration error" after a
      # perfectly good extraction, which is noise rather than a finding. Detect
      # it up front, say why, and skip — the same contract as a local gate
      # skipping a tool it cannot run: never red for something this plan
      # cannot do, and never silent about it either. Enabling Code Security,
      # or making the repo public, flips this to a real analysis with no
      # further edits. Same change as sparknet's codeql.yml.
      - name: Check code scanning is available
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info=$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '[.private, (.security_and_analysis.advanced_security.status // "disabled")] | @tsv')
          read -r private status <<< "$info"
          if [ "$private" = "false" ] || [ "$status" = "enabled" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CodeQL skipped::${GITHUB_REPOSITORY} is private and GitHub Code Security is not enabled, so GitHub cannot run code scanning here. The local \`make ci\` gate stays authoritative; this job analyses for real once Code Security is enabled or the repo goes public."
          fi

      - name: Set up Go
        if: steps.availability.outputs.available == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        if: steps.availability.outputs.available == 'true'
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: go

      - name: Analyze
        if: steps.availability.outputs.available == 'true'
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          category: "/language:go"

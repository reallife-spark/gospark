# goSpark control-plane example configuration.
#
# The control plane IS the fabric master role: it holds the operational signing
# key and dispatches signed tasks. Start it with:
#
#   sparknet-control -config configs/control.example.yaml \
#     -master-key .state/control.key \
#     -executors node-a=BASE64PUB,node-b=BASE64PUB

node:
  # id/role are overwritten from the loaded key file.
  id: control
  role: master
  key_file: .state/control.key
  overlay_ipv4: 10.44.0.1
  capabilities:
    - telemetry
    - cluster-dispatch

bus:
  # Empty url => in-memory bus (single process / tests). For a real deployment
  # set a NATS/JetStream URL, e.g. nats://10.44.0.1:4222. The server must be
  # started with JetStream enabled (nats-server -js) for store-and-forward.
  url: ""
  subject_root: sparknet
  stream: SPARKNET
  # queue: leave empty for a single control plane. Set the same value on HA
  # replicas so they load-balance tasks/results instead of double-processing.
  queue: ""
  # max_deliver bounds JetStream redelivery of a failing message before it is
  # dead-lettered (default 5). Stops a poison message spinning the node.
  max_deliver: 5

transport:
  # HTTP/3 (QUIC) data plane for NVFP4 KV blocks.
  listen: 0.0.0.0:7443
  chunk_size: 262144
  timeout: 10s
  # Mutual-TLS pin. Required for a non-loopback listener; the peer certificate
  # fingerprint is the same value `sparknetctl` prints.
  client_fingerprint: ""
  allow_unauthenticated: false

gateway:
  # The Go API gateway in front of the local compute plane.
  listen: 127.0.0.1:8080
  upstream: http://127.0.0.1:8000
  # Serving model this gateway fronts; reported by /readyz and /healthz and used
  # as /v1/models discovery when no upstream is set.
  model: Qwen/Qwen2.5-32B-Instruct
  # Upstream path probed by /readyz and the probe timeout (defaults: /v1/models, 2s).
  ready_path: /v1/models
  probe_timeout: 2s
  # Admission control: bound concurrent inference requests to the engine and
  # queue the overflow. Edge admission, not batching — vLLM does continuous
  # batching; this only keeps the engine from being oversubscribed. 0 disables.
  max_inflight: 0
  max_queued: 0
  queue_wait: 0s

# KV-routing seam: the compute-plane RadixAttention engine that knows which node
# holds a prompt's cached KV prefix. Empty endpoint leaves placement to GPU
# telemetry alone; the hint is advisory and degrades gracefully.
kv:
  endpoint: ""
  secret: ""
  timeout: 2s

mesh:
  interface: wg0
  wg_config: /etc/wireguard/wg0.conf

router:
  edge_token_ceiling: 2048
  cluster_token_floor: 32768
  max_nodes: 4

registry:
  # Node authorizations the control plane signs and serves. Point -registry (or
  # this key) at a file produced by `sparknetctl registry sign`; the control
  # plane re-signs it with its own key. Empty => open mode (not fail-closed).
  file: ""

admin:
  # Live registry control for operators: `sparknetctl admin show|authorize|revoke`.
  # The
  # process holds the Master key, so this surface has full registry authority
  # and the server refuses to bind anything but a loopback address. Empty
  # (the default) disables it entirely.
  listen: "127.0.0.1:8899"
  # Required whenever listen is set. Loopback is not an authorization boundary:
  # any local process could otherwise re-sign the registry through this surface.
  # Supply it via GOSPARK_ADMIN_TOKEN rather than committing a literal.
  token: ""  # set via GOSPARK_ADMIN_TOKEN; startup fails closed without it

metrics:
  # Prometheus surface. /admin/metrics is always served on the admin listener
  # above; a non-empty listen here additionally starts a standalone server that
  # answers /metrics and /healthz for a scrape. It carries node ids,
  # authorization state and accelerator telemetry, so keep it on a trusted
  # network interface. Empty (the default) disables the standalone listener.
  listen: ""

log:
  level: info
  format: json

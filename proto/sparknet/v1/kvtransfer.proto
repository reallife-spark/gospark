// NVFP4 KV-cache transfer contract (data plane).
//
// The data plane is deliberately separate from the control plane. It carries
// NVFP4-compressed KV-cache blocks over HTTP/3 (QUIC) so that a dropped packet
// on one block stream cannot head-of-line-block adjacent streams.
//
// NVFP4 layout: E2M1 4-bit values packed two-per-byte, a per-16-element block
// scale, and a tensor-level global scale. See internal/kvtransfer for the
// reference codec. Transport is defined in internal/transport.

syntax = "proto3";

package sparknet.v1;

option go_package = "github.com/reallife-spark/goSpark/internal/apiv1";

// BlockHeader is the JSON object sent as the first length-prefixed frame of a
// stream. It is not encoded as a protobuf message on the wire; this file is the
// field contract, not the framing.
message BlockHeader {
  string block_id = 1;
  string origin_node_id = 2;
  string digest = 3;                // sha256 hex over Block.Canonical(): count, scales, packed length and packed bytes
  uint32 num_elements = 4;
  uint32 num_blocks = 5;            // ceil(num_elements / 16)
  float global_scale = 6;           // FP32 tensor-level scale
  string dtype = 7;                 // "nvfp4-e2m1"
  int64 created_at_unix = 8;
}

// BlockChunk describes one slice of the packed payload. The current transport
// uses raw 4-byte big-endian length-prefixed frames (an empty frame ends the
// payload), not a protobuf BlockChunk message.
message BlockChunk {
  string block_id = 1;
  uint32 seq = 2;
  bool last = 3;
  bytes data = 4;
}

// SemanticDelta is the delta-sync control shape: a peer advertises the digests
// it holds. It does not travel in the current QUIC data plane; the local
// DeltaCache uses it in-process.
message SemanticDelta {
  string namespace = 1;
  repeated string have_digests = 2;
  repeated string want_digests = 3;
}
